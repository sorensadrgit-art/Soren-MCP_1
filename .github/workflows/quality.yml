name: Source quality
on:
  pull_request:
  push:
    branches: [main, stable]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, resolved 2026-10-20
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Typecheck
        run: npm run typecheck
      - name: Knowledge content hashes (fails on drift)
        run: npm run knowledge:hash
      - name: Foundry approved-skill hashes and review receipts
        run: npm run foundry:verify
      - name: Legacy routing evaluation (frozen fixture + versioned expectations)
        run: npm run evaluate:routing
      - name: V3 routing evaluation
        run: npm run evaluate:v3-routing
      - run: npm test
      - run: npm audit --audit-level=critical
      - run: npm run build
        env:
          SOREN_CAPABILITY_MODE: public_only
      - name: MCP contract over HTTP, SOREN_V3_TOOLS off (8 tools)
        run: npm run verify:mcp-contract -- --flag off --port 3917
        env:
          SOREN_CAPABILITY_MODE: public_only
      - name: MCP contract over HTTP, SOREN_V3_TOOLS on (14 tools)
        run: npm run verify:mcp-contract -- --flag on --port 3918
        env:
          SOREN_CAPABILITY_MODE: public_only
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-quality-results
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
  native-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_PASSWORD: isolated-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:db:native
        env:
          SOREN_TEST_DATABASE_URL: postgres://postgres:isolated-ci-only@127.0.0.1:5432/postgres
