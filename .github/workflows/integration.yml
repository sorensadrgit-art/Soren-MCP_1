name: Trusted isolated integration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    environment: isolated-ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/operations/database.test.mjs tests/updates/database.test.mjs
      # Uses local PGlite PostgreSQL fixtures. Hosted Supabase OAuth/storage and browser gates remain separate.
